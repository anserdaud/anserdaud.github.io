<main>
<section class="banner banner-page parallax" style="background-image: url('images/hero-connect.jpg'); background-size: max(100vw, 760px) auto; background-position: center calc(max(100vw, 760px) * -0.22625);">
  <div class="container">
    <h1>Get In Touch</h1>
  </div>
</section>

<section class="section">
  <div class="container cols">
    <div class="col">
      <!--
        CONTACT FORM SETUP
        Right now (data-endpoint empty) the form opens the visitor's email app.
        To receive messages straight to your inbox instead, create a free form at
        https://formspree.io and paste its URL into data-endpoint, e.g.
        data-endpoint="https://formspree.io/f/abcdwxyz"
      -->
      <form class="contact-form" id="contact-form" data-endpoint="https://formspree.io/f/xkjrbkoq" data-fallback-email="anser.daud@gmail.com" novalidate>
        <h2 class="section-title">Connect with me!</h2>
        <p class="required-note"><span class="req">*</span> Indicates required field</p>

        <div class="field">
          <span class="label">Name <span class="req">*</span></span>
          <div class="name-row">
            <div>
              <input id="first-name" name="first_name" type="text" placeholder="First" autocomplete="given-name" required>
              <label class="sublabel" for="first-name">First</label>
            </div>
            <div>
              <input id="last-name" name="last_name" type="text" placeholder="Last" autocomplete="family-name" required>
              <label class="sublabel" for="last-name">Last</label>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="email">Email <span class="req">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="message">Comment <span class="req">*</span></label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <input type="hidden" name="_subject" value="New message from your website">
        <input class="hp-field" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button class="btn" type="submit">Submit</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div class="col">
      <figure class="figure" style="padding-top: 10px; text-align: left;"><img src="images/web/screenshot-2026-11-16-at-1-09-22-am.jpg" alt="Dr. Anser Daud"></figure>
    </div>
  </div>
</section>
